<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mes gains – ScanConcours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  style.css
</head>
<body>
  <!-- HEADER -->

  <main class="page">
    <section class="section">
      <div class="container">
        <h1>Mes gains</h1>
        <p class="sub">Suivez l’état de vos participations : gagné, en attente, perdu.</p>

        <div class="gains-filters">
          <button data-status="all" class="btn-chip active">Tous</button>
          <button data-status="won" class="btn-chip">🎉 Gagné</button>
          <button data-status="pending" class="btn-chip">⏳ En attente</button>
          <button data-status="lost" class="btn-chip">❌ Perdu</button>
        </div>

        <div id="gainsList" class="gains-list"></div>
      </div>
    </section>
  </main>

  script.js
</body>
</html>
