<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un compte – ScanConcours</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">ScanConcours</a>

      <button class="nav-toggle" aria-label="Ouvrir le menu">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>

      <nav class="nav" data-open="false">
        <a href="index.html">Concours</a>
        <a href="favoris.html">Mes favoris</a>
        <a href="gains.html">Mes gains</a>
        <a href="login.html" id="nav-login">Connexion</a>
        <a href="signup.html" id="nav-signup" class="nav-cta">Inscription</a>
        <button type="button" id="nav-logout" class="nav-logout" hidden>Déconnexion</button>
      </nav>

    </div>
  </header>

  <main class="page auth-page">
    <section class="section">
      <div class="container">

        <div class="auth-card">
          <h1>Créer un compte</h1>
          <p class="auth-sub">Synchronisez vos favoris et vos gains sur tous vos appareils.</p>

          <form id="signupForm" class="auth-form">
            <div class="field">
              <label for="signupEmail">Email</label>
              <input type="email" id="signupEmail" required placeholder="vous@example.com">
            </div>

            <div class="field">
              <label for="signupPassword">Mot de passe</label>
              <input type="password" id="signupPassword" required minlength="6" placeholder="Minimum 6 caractères">
            </div>

            <button type="submit" class="btn-primary">Créer mon compte</button>
            <p class="auth-message" id="signupMessage"></p>
          </form>

          <p class="auth-links">
            Vous avez déjà un compte ?
            <a href="login.html">Se connecter</a>
          </p>
        </div>

      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>

</body>
</html>
