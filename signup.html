<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un compte – ScanConcours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <h2>Créer un compte</h2>
    <p class="auth-sub">Un compte synchronise vos favoris et vos gains.</p>

    <form id="signupForm">
      <label>Email</label>
      <input type="email" id="signupEmail" required>

      <label>Mot de passe</label>
      <input type="password" id="signupPassword" minlength="8" required>

      <button class="btn-primary" type="submit">Créer mon compte</button>
      <p id="signupMessage" class="auth-message"></p>
    </form>

    <p class="auth-links">
      Déjà un compte ?
      login.htmlConnectez-vous</a>
    </p>
  </div>

</body>
</html>
